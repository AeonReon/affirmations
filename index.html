<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Lumina — Daily Affirmations</title>
<meta name="description" content="A luminous daily affirmation practice. Wisdom for self, love, abundance, change, healing and flow.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1135">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root{
    --ink:#0a1135;
    --ink-2:#141a45;
    --ink-3:#1c2358;
    --gold:#e8c275;
    --gold-deep:#c9a45a;
    --gold-light:#f5d997;
    --gold-glow:rgba(232,194,117,0.18);
    --rose:#f4a8b8;
    --violet:#8d7cf0;
    --azure:#7fb0ff;
    --paper:#fbf5e8;
    --paper-soft:rgba(251,245,232,0.92);
    --text:#fbf5e8;
    --text-soft:rgba(251,245,232,0.72);
    --text-mute:rgba(251,245,232,0.45);
    --line:rgba(232,194,117,0.18);
    --line-soft:rgba(251,245,232,0.08);
    --card:rgba(255,255,255,0.04);
    --card-2:rgba(255,255,255,0.06);
    --radius:22px;
    --radius-lg:28px;
    --shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }

  html,body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  body{
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(141,124,240,0.18), transparent 60%),
      radial-gradient(900px 700px at -10% 20%, rgba(244,168,184,0.10), transparent 60%),
      radial-gradient(1100px 800px at 50% 110%, rgba(232,194,117,0.14), transparent 60%),
      linear-gradient(180deg, #0a1135 0%, #0d1645 40%, #0a1135 100%);
    background-attachment:fixed;
  }

  /* Aurora orbs floating in background */
  .aurora{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .orb{
    position:absolute; border-radius:50%; filter:blur(80px); opacity:0.55;
    animation: drift 22s ease-in-out infinite;
  }
  .orb.gold  { width:420px; height:420px; background:radial-gradient(circle,#e8c275,transparent 70%); top:-80px; right:-100px; }
  .orb.rose  { width:380px; height:380px; background:radial-gradient(circle,#f4a8b8,transparent 70%); bottom:10%; left:-120px; animation-delay:-8s; }
  .orb.violet{ width:520px; height:520px; background:radial-gradient(circle,#8d7cf0,transparent 70%); top:35%; right:-200px; animation-delay:-14s; opacity:0.4; }
  .orb.azure { width:340px; height:340px; background:radial-gradient(circle,#7fb0ff,transparent 70%); top:60%; left:30%; animation-delay:-4s; opacity:0.3; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%   { transform:translate(40px,-30px) scale(1.07); }
    66%   { transform:translate(-30px,30px) scale(0.96); }
  }

  /* Subtle starfield */
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.5), transparent);
    background-size: 600px 600px;
    animation: twinkle 8s ease-in-out infinite alternate;
    opacity:0.55;
  }
  @keyframes twinkle{ from{opacity:0.35;} to{opacity:0.7;} }

  .app{
    position:relative; z-index:1;
    max-width:480px;
    margin:0 auto;
    padding:0 22px calc(40px + var(--safe-bottom));
    min-height:100vh;
    min-height:100dvh;
  }

  /* ---------- HEADER / BRAND ---------- */
  .brand{
    text-align:center;
    padding: calc(48px + var(--safe-top)) 0 24px;
  }
  .logo{
    width:74px; height:74px; margin:0 auto 16px;
    display:block;
    filter: drop-shadow(0 8px 30px rgba(232,194,117,0.4));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%   { transform:translateY(-6px); }
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:34px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    background: linear-gradient(180deg, #f5d997 0%, #e8c275 60%, #c9a45a 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:8px;
  }
  .brand .tag{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:var(--text-soft);
    letter-spacing:0.06em;
  }
  .brand .divider{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:14px; opacity:0.7;
  }
  .brand .divider::before, .brand .divider::after{
    content:''; height:1px; width:36px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .brand .divider svg{ width:10px; height:10px; }

  /* ---------- INSPIRE HERO CARD ---------- */
  .inspire-hero{
    position:relative;
    margin: 8px 0 40px;
    padding: 36px 26px 30px;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(150deg, rgba(232,194,117,0.12), rgba(141,124,240,0.08) 60%, rgba(244,168,184,0.08));
    border:1px solid var(--line);
    overflow:hidden;
    isolation:isolate;
    text-align:center;
  }
  .inspire-hero::before{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(400px 300px at 100% -10%, rgba(232,194,117,0.22), transparent 60%),
      radial-gradient(400px 300px at -10% 110%, rgba(141,124,240,0.22), transparent 60%);
    z-index:-1;
  }
  .inspire-hero::after{
    content:''; position:absolute; top:0; left:24px; right:24px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .inspire-hero .label{
    font-size:10px; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--gold-light); font-weight:500;
    margin-bottom:22px;
  }
  .inspire-hero .quote{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:25px;
    line-height:1.45;
    color:var(--paper);
    letter-spacing:0.005em;
    min-height:120px;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .35s ease, transform .35s ease;
  }
  .inspire-hero .quote.fade{ opacity:0; transform:translateY(6px); }
  .inspire-hero .source{
    margin-top:12px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:13px;
    color:var(--text-mute);
    letter-spacing:0.08em;
    transition:opacity .35s ease;
  }
  .inspire-hero .source.fade{ opacity:0; }

  /* Big inspire button */
  .inspire-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    margin-top:22px;
    padding: 14px 30px;
    border-radius:999px;
    background: linear-gradient(135deg, rgba(232,194,117,0.22), rgba(141,124,240,0.16));
    border:1px solid var(--gold);
    color:var(--gold-light);
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    cursor:pointer;
    font-weight:500;
    transition:all .25s ease;
    box-shadow: 0 8px 30px -10px var(--gold-glow);
  }
  .inspire-btn:hover{
    background: linear-gradient(135deg, rgba(232,194,117,0.32), rgba(141,124,240,0.22));
    box-shadow: 0 12px 40px -10px rgba(232,194,117,0.4);
    transform:translateY(-1px);
  }
  .inspire-btn:active{ transform:translateY(0); }
  .inspire-btn svg{ width:14px; height:14px; }

  /* ---------- THEMES ---------- */
  .theme{ margin-bottom:34px; }
  .theme-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; padding: 0 4px;
  }
  .theme-head h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:18px;
    letter-spacing:0.04em;
    color:var(--paper);
  }
  .theme-head .count{
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-mute);
  }
  .theme-line{
    height:1px;
    background:linear-gradient(90deg, var(--gold) 0%, transparent 50%);
    margin-bottom:16px;
    opacity:0.45;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }

  .cat{
    position:relative;
    padding:18px 16px 16px;
    border-radius:var(--radius);
    background:var(--card);
    border:1px solid var(--line-soft);
    cursor:pointer;
    text-align:left;
    color:inherit;
    font-family:inherit;
    overflow:hidden;
    transition:all .35s cubic-bezier(.2,.8,.2,1);
  }
  .cat::before{
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-deep), transparent);
    opacity:0;
    transition:opacity .35s ease;
  }
  .cat::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(280px 180px at 50% 120%, var(--gold-glow), transparent 60%);
    opacity:0;
    transition:opacity .4s ease;
  }
  .cat:hover, .cat:active{
    background:var(--card-2);
    border-color:var(--line);
    transform:translateY(-2px);
  }
  .cat:hover::before, .cat:active::before{ opacity:1; }
  .cat:hover::after, .cat:active::after{ opacity:1; }

  .cat .ico{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(232,194,117,0.18), rgba(141,124,240,0.10));
    margin-bottom:14px;
    color:var(--gold-light);
  }
  .cat .ico svg{ width:18px; height:18px; }
  .cat .name{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:500;
    color:var(--paper);
    line-height:1.25;
    margin-bottom:4px;
  }
  .cat .num{
    font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-mute);
  }

  /* ---------- CATEGORY VIEW ---------- */
  .view{
    position:fixed; inset:0; z-index:50;
    background:
      radial-gradient(900px 600px at 80% -10%, rgba(141,124,240,0.18), transparent 60%),
      radial-gradient(800px 600px at -10% 100%, rgba(232,194,117,0.16), transparent 60%),
      linear-gradient(180deg, #0a1135 0%, #0c1340 50%, #0a1135 100%);
    transform:translateX(100%);
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .view.open{ transform:translateX(0); }

  .view-head{
    flex-shrink:0;
    padding: calc(16px + var(--safe-top)) 22px 14px;
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--line-soft);
    backdrop-filter: blur(12px);
    background:rgba(10,17,53,0.6);
  }
  .icon-btn{
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line-soft);
    border-radius:50%;
    color:var(--gold-light);
    cursor:pointer;
    transition:all .25s ease;
  }
  .icon-btn:hover{ background:var(--gold-glow); border-color:var(--gold); }
  .icon-btn svg{ width:16px; height:16px; }
  .view-title{
    flex:1; text-align:center;
    font-family:'Fraunces',serif;
    font-size:17px;
    color:var(--paper);
    letter-spacing:0.03em;
  }
  .view-title .sub{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--text-mute); margin-top:3px;
  }

  /* ---------- SINGLE-CARD CATEGORY VIEW ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:center;
    padding: 22px 22px calc(28px + var(--safe-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .stage::-webkit-scrollbar{ width:0; }

  .single{
    position:relative;
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding: 44px 28px 36px;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(150deg, rgba(232,194,117,0.10), rgba(141,124,240,0.06) 60%, rgba(244,168,184,0.06));
    border:1px solid var(--line);
    overflow:hidden;
    isolation:isolate;
    text-align:center;
    min-height:300px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .single::before{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(400px 300px at 100% -10%, rgba(232,194,117,0.18), transparent 60%),
      radial-gradient(400px 300px at -10% 110%, rgba(141,124,240,0.18), transparent 60%);
    z-index:-1;
  }
  .single::after{
    content:''; position:absolute; top:0; left:28px; right:28px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .single .text{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:27px;
    line-height:1.45;
    color:var(--paper);
    letter-spacing:0.005em;
    transition: opacity .35s ease, transform .35s ease;
  }
  .single .text.fade{ opacity:0; transform:translateY(6px); }
  .single .pos{
    margin-top:24px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--text-mute);
    text-transform:uppercase;
  }

  .stage-actions{
    display:flex; gap:14px; align-items:center; justify-content:center;
    margin-top:22px;
    width:100%; max-width:440px; margin-left:auto; margin-right:auto;
  }
  .stage-actions .heart-big{
    width:48px; height:48px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line-soft);
    border-radius:50%;
    color:var(--text-mute);
    cursor:pointer;
    transition:all .25s ease;
    flex-shrink:0;
  }
  .stage-actions .heart-big svg{ width:18px; height:18px; }
  .stage-actions .heart-big.on{ color:var(--rose); border-color:rgba(244,168,184,0.4); background:rgba(244,168,184,0.08); }
  .stage-actions .heart-big.on svg{ fill:var(--rose); }
  .stage-actions .heart-big:hover{ color:var(--rose); border-color:var(--rose); transform:scale(1.05); }

  .stage-actions .inspire-btn{ margin-top:0; }

  /* ---------- FAVOURITES LIST (small cards) ---------- */
  .aff{
    position:relative;
    margin-bottom:14px;
    padding: 26px 24px 22px;
    border-radius:var(--radius);
    background:rgba(255,255,255,0.035);
    border:1px solid var(--line-soft);
    overflow:hidden;
    opacity:0;
    transform:translateY(14px);
    animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{ to { opacity:1; transform:translateY(0); } }
  .aff::before{
    content:''; position:absolute; top:0; left:24px; right:24px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.6;
  }
  .aff .num{
    position:absolute; top:14px; right:18px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:11px;
    color:var(--text-mute);
    letter-spacing:0.1em;
  }
  .aff .text{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:20px;
    line-height:1.5;
    color:var(--paper);
    letter-spacing:0.005em;
  }
  .aff .actions{
    margin-top:14px;
    display:flex; gap:10px; align-items:center;
  }
  .aff .heart{
    background:none; border:none; cursor:pointer; color:var(--text-mute);
    padding:4px;
    display:flex; align-items:center;
    transition:all .2s ease;
  }
  .aff .heart svg{ width:18px; height:18px; }
  .aff .heart.on{ color:var(--rose); }
  .aff .heart.on svg{ fill:var(--rose); }
  .aff .heart:hover{ color:var(--rose); transform:scale(1.1); }

  /* ---------- FAVORITES TAB ---------- */
  .quick-bar{
    display:flex; gap:8px; margin-bottom:24px; justify-content:center;
  }
  .quick-bar button{
    background:var(--card);
    border:1px solid var(--line-soft);
    color:var(--text-soft);
    padding:10px 18px;
    border-radius:999px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .25s ease;
  }
  .quick-bar button.active{
    background:linear-gradient(135deg, rgba(232,194,117,0.22), rgba(141,124,240,0.10));
    border-color:var(--gold);
    color:var(--gold-light);
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-mute);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:18px;
  }

  /* ---------- FOOTER ---------- */
  .foot{
    text-align:center;
    margin-top:40px;
    padding: 24px 0;
    color:var(--text-mute);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:0.06em;
    border-top:1px solid var(--line-soft);
  }

  /* responsive */
  @media (min-width: 520px){
    .grid{ grid-template-columns:repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="aurora">
  <div class="orb gold"></div>
  <div class="orb rose"></div>
  <div class="orb violet"></div>
  <div class="orb azure"></div>
</div>
<div class="stars"></div>

<div class="app">

  <header class="brand">
    <!-- Logo: sun + lotus + crescent emblem -->
    <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Lumina logo">
      <defs>
        <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f5d997"/>
          <stop offset="50%" stop-color="#e8c275"/>
          <stop offset="100%" stop-color="#c9a45a"/>
        </linearGradient>
        <linearGradient id="lg-blue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7fb0ff"/>
          <stop offset="100%" stop-color="#4a5eff" stop-opacity="0.6"/>
        </linearGradient>
        <radialGradient id="rg-glow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#f5d997" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#f5d997" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- ambient glow -->
      <circle cx="50" cy="50" r="48" fill="url(#rg-glow)"/>
      <!-- outer ring of rays -->
      <g stroke="url(#lg-gold)" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
        <line x1="50" y1="6"  x2="50" y2="14"/>
        <line x1="50" y1="86" x2="50" y2="94"/>
        <line x1="6"  y1="50" x2="14" y2="50"/>
        <line x1="86" y1="50" x2="94" y2="50"/>
        <line x1="18" y1="18" x2="24" y2="24"/>
        <line x1="76" y1="76" x2="82" y2="82"/>
        <line x1="82" y1="18" x2="76" y2="24"/>
        <line x1="24" y1="76" x2="18" y2="82"/>
      </g>
      <!-- crescent -->
      <path d="M50 22 a26 26 0 1 0 18 44 a20 20 0 1 1 -18 -44 z" fill="url(#lg-gold)" opacity="0.95"/>
      <!-- inner sun -->
      <circle cx="50" cy="50" r="12" fill="url(#lg-blue)" opacity="0.7"/>
      <circle cx="50" cy="50" r="6" fill="#f5d997"/>
    </svg>
    <h1>Lumina</h1>
    <p class="tag">a daily practice in becoming</p>
    <div class="divider">
      <svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="2" fill="#e8c275"/></svg>
    </div>
  </header>

  <!-- Inspire hero (random from anywhere) -->

/* ---------------- LOGIC ---------------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const FAV_KEY = 'lumina_favs_v1';
let favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
const saveFavs = () => localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));

let activeTab = 'all';
let currentCat = null;
let currentIdx = null;          // index in current category
let heroIdx = null;             // current hero affirmation as { catId, idx }

// Track "seen" indices per category (and a special "ALL" pool for hero)
// so each Inspire-me cycles through everything before repeating.
const seen = { _all: new Set() };

function allAffirmations(){
  const out = [];
  for (const theme of THEMES){
    for (const c of theme.cats){
      const items = A[c.id] || [];
      items.forEach((text, i) => out.push({ text, catId:c.id, catName:c.name, key:`${c.id}::${i}` }));
    }
  }
  return out;
}

function findCat(id){
  for (const t of THEMES){
    const c = t.cats.find(x => x.id === id);
    if (c) return c;
  }
  return null;
}

/* Pick a fresh random index from items.length, tracked in `seenSet`. Resets when exhausted. */
function pickFresh(seenSet, total, exclude = -1){
  if (seenSet.size >= total) seenSet.clear();
  let attempts = 0;
  let idx;
  do {
    idx = Math.floor(Math.random() * total);
    attempts++;
  } while ((seenSet.has(idx) || idx === exclude) && attempts < total * 4);
  seenSet.add(idx);
  return idx;
}

/* ----- Render home (categories or favourites) ----- */
function renderHome(){
  const home = $('#home');
  if (activeTab === 'fav'){
    const flat = allAffirmations().filter(a => favs.has(a.key));
    if (!flat.length){
      home.innerHTML = '<div class="empty">No favourites yet.<br>Tap the heart on any affirmation to keep it close.</div>';
      return;
    }
    let html = '';
    flat.forEach((a, i) => {
      html += `<div class="aff" style="animation-delay:${Math.min(i*40,400)}ms">
        <span class="num">${escapeHtml(a.catName)}</span>
        <p class="text">${escapeHtml(a.text)}</p>
        <div class="actions">
          <button class="heart on" data-key="${a.key}" aria-label="Unfavourite">${ICONS.heart}</button>
        </div>
      </div>`;
    });
    home.innerHTML = html;
    $$('.aff .heart').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.key;
        if (favs.has(k)) favs.delete(k); else favs.add(k);
        saveFavs();
        renderHome();
      });
    });
    return;
  }

  let html = '';
  for (const theme of THEMES){
    const totalAff = theme.cats.reduce((s,c)=> s + (A[c.id]?.length || 0), 0);
    html += `<section class="theme">
      <div class="theme-head">
        <h2>${escapeHtml(theme.name)}</h2>
        <span class="count">${theme.cats.length} · ${totalAff}</span>
      </div>
      <div class="theme-line"></div>
      <div class="grid">`;
    for (const c of theme.cats){
      const count = (A[c.id] || []).length;
      html += `<button class="cat" data-cat="${c.id}">
        <div class="ico">${ICONS[c.icon] || ICONS.spark}</div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="num">${count} affirmations</div>
      </button>`;
    }
    html += `</div></section>`;
  }
  home.innerHTML = html;
  $$('.cat').forEach(b => b.addEventListener('click', () => openCat(b.dataset.cat)));
}

/* ----- Hero "Inspire Me" (random from anywhere) ----- */
function inspireHero(){
  const all = allAffirmations();
  const exclude = heroIdx == null ? -1 : heroIdx;
  const idx = pickFresh(seen._all, all.length, exclude);
  heroIdx = idx;
  const pick = all[idx];

  const q = $('#hero-quote'), s = $('#hero-source');
  q.classList.add('fade'); s.classList.add('fade');
  setTimeout(() => {
    q.textContent = pick.text;
    s.textContent = `— ${pick.catName} —`;
    $('#hero').dataset.key = pick.key;
    q.classList.remove('fade'); s.classList.remove('fade');
  }, 280);
}

/* ----- Category single-card view ----- */
function openCat(id){
  const c = findCat(id);
  if (!c) return;
  currentCat = c;
  if (!seen[id]) seen[id] = new Set();
  $('#view-title').firstChild.nodeValue = c.name;
  $('#view-sub').textContent = `${(A[id]||[]).length} affirmations`;
  // Show first one immediately
  currentIdx = null;
  inspireSingle(true);
  const view = $('#view');
  view.classList.add('open');
  view.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function closeCat(){
  $('#view').classList.remove('open');
  $('#view').setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

function inspireSingle(initial = false){
  const items = A[currentCat.id] || [];
  const exclude = currentIdx == null ? -1 : currentIdx;
  const idx = pickFresh(seen[currentCat.id], items.length, exclude);
  currentIdx = idx;
  const text = items[idx];
  const key = `${currentCat.id}::${idx}`;
  const seenN = seen[currentCat.id].size;

  const t = $('#single-text');
  const p = $('#single-pos');
  const h = $('#single-heart');

  if (initial){
    t.classList.remove('fade');
    t.textContent = text;
    p.textContent = `${seenN} of ${items.length}`;
    h.classList.toggle('on', favs.has(key));
    h.dataset.key = key;
  } else {
    t.classList.add('fade');
    setTimeout(() => {
      t.textContent = text;
      p.textContent = `${seenN} of ${items.length}`;
      h.classList.toggle('on', favs.has(key));
      h.dataset.key = key;
      t.classList.remove('fade');
    }, 280);
  }
}

function toggleSingleFav(){
  const key = $('#single-heart').dataset.key;
  if (!key) return;
  if (favs.has(key)) { favs.delete(key); $('#single-heart').classList.remove('on'); }
  else { favs.add(key); $('#single-heart').classList.add('on'); }
  saveFavs();
}

/* ----- Helpers ----- */
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ----- Init ----- */
document.addEventListener('DOMContentLoaded', () => {
  renderHome();
  inspireHero();

  $('#hero-btn').addEventListener('click', inspireHero);
  $('#back').addEventListener('click', closeCat);
  $('#single-next').addEventListener('click', () => inspireSingle(false));
  $('#single-heart').addEventListener('click', toggleSingleFav);

  $$('.quick-bar button').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.quick-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      renderHome();
    });
  });

  // Tap hero card body to jump into the source category
  $('#hero').addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const key = $('#hero').dataset.key;
    if (key){ openCat(key.split('::')[0]); }
  });

  // ESC closes category view
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeCat();
  });
});
</script>
