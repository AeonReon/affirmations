<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Daily Affirmations</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e2a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0e2a;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(202,169,89,0.25);
    --gold: #caa959;
    --gold-light: #e2c97a;
    --gold-soft: rgba(202,169,89,0.12);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.45);
    --text-muted: rgba(255,255,255,0.25);
    --radius: 20px;
  }

  html, body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient mesh gradient background */
  .bg-mesh {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .bg-mesh::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    top: -200px;
    right: -150px;
    background: radial-gradient(circle, rgba(30,40,120,0.5) 0%, transparent 70%);
    filter: blur(60px);
  }

  .bg-mesh::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    bottom: -100px;
    left: -200px;
    background: radial-gradient(circle, rgba(202,169,89,0.08) 0%, transparent 70%);
    filter: blur(80px);
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 52px 0 36px;
  }

  .header-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Categories */
  .categories {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 40px;
  }

  .categories.hidden { display: none; }

  .category-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .category-card:hover, .category-card:active {
    background: var(--surface-hover);
    border-color: var(--border-hover);
  }

  .category-card:active {
    transform: scale(0.98);
  }

  .cat-emoji {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--gold-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
  }

  .cat-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.1px;
  }

  .cat-chevron {
    width: 16px;
    height: 16px;
    opacity: 0.2;
    transition: opacity 0.25s, transform 0.25s;
  }

  .category-card:hover .cat-chevron {
    opacity: 0.4;
    transform: translateX(2px);
  }

  /* Affirmation View */
  .affirmation-view {
    display: none;
    flex: 1;
    flex-direction: column;
    padding-bottom: 40px;
  }

  .affirmation-view.active {
    display: flex;
    animation: viewIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes viewIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .nav-bar {
    display: flex;
    align-items: center;
    padding: 8px 0 4px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--gold);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 8px 0;
    font-family: inherit;
    transition: opacity 0.2s;
  }

  .back-btn:hover { opacity: 0.65; }

  .back-btn svg { width: 16px; height: 16px; }

  .view-category-name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    text-align: center;
    color: var(--text);
    margin: 20px 0 0;
  }

  .view-category-emoji {
    text-align: center;
    font-size: 32px;
    margin-bottom: 6px;
  }

  /* The affirmation display */
  .affirmation-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 0;
  }

  .affirmation-glass {
    width: 100%;
    padding: 44px 28px;
    background: linear-gradient(160deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 28px;
    text-align: center;
    position: relative;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .affirmation-glass::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 30px;
    right: 30px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(202,169,89,0.3), transparent);
  }

  .aff-text {
    font-family: 'DM Serif Display', serif;
    font-size: 21px;
    line-height: 1.65;
    font-weight: 400;
    color: var(--text);
    opacity: 0;
    transform: translateY(8px) scale(0.98);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .aff-text.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .aff-placeholder {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text-muted);
    font-weight: 300;
    font-style: italic;
  }

  /* Inspire button */
  .inspire-btn {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: var(--bg);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 24px rgba(202,169,89,0.2);
    position: relative;
    overflow: hidden;
  }

  .inspire-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.15) 100%);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .inspire-btn:hover::before { opacity: 1; }

  .inspire-btn:hover {
    box-shadow: 0 8px 32px rgba(202,169,89,0.3);
    transform: translateY(-1px);
  }

  .inspire-btn:active {
    transform: translateY(0) scale(0.98);
    box-shadow: 0 2px 12px rgba(202,169,89,0.2);
  }

  /* Share */
  .footer-actions {
    display: flex;
    justify-content: center;
    padding-top: 16px;
    min-height: 48px;
  }

  .share-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 400;
    padding: 8px 20px;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
    opacity: 0;
    pointer-events: none;
  }

  .share-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  .share-btn:hover {
    border-color: var(--border-hover);
    color: var(--gold);
  }

  /* Responsive */
  @media (max-width: 380px) {
    .header { padding-top: 36px; }
    .header h1 { font-size: 23px; }
    .aff-text { font-size: 19px; }
    .affirmation-glass { padding: 36px 22px; }
  }

  @media (min-height: 800px) {
    .affirmation-area { padding: 40px 0; }
  }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="app">
  <div class="header">
    <img class="header-icon" src="icon.png" alt="Daily Affirmations">
    <h1>Daily Affirmations</h1>
    <p>Nourish Your Soul</p>
  </div>

  <div class="categories" id="cats"></div>

  <div class="affirmation-view" id="affView">
    <div class="nav-bar">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
    </div>
    <div class="view-category-emoji" id="viewEmoji"></div>
    <div class="view-category-name" id="viewName"></div>
    <div class="affirmation-area">
      <div class="affirmation-glass">
        <p class="aff-text show" id="affText">
          <span class="aff-placeholder">Tap below to receive your affirmation</span>
        </p>
      </div>
    </div>
    <button class="inspire-btn" id="inspBtn" onclick="inspire()">Inspire Me</button>
    <div class="footer-actions">
      <button class="share-btn" id="shareBtn" onclick="share()">Share</button>
    </div>
  </div>
</div>

let cur = null, last = -1;

function init() {
  const c = document.getElementById('cats');
  for (const [name, d] of Object.entries(data)) {
    const el = document.createElement('div');
    el.className = 'category-card';
    el.onclick = () => open(name);
    el.innerHTML = `
      <div class="cat-emoji">${d.e}</div>
      <div class="cat-label">${name}</div>
      <svg class="cat-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    `;
    c.appendChild(el);
  }
}

function open(name) {
  cur = name; last = -1;
  document.getElementById('cats').classList.add('hidden');
  const v = document.getElementById('affView');
  v.classList.remove('active');
  void v.offsetWidth;
  v.classList.add('active');
  document.getElementById('viewEmoji').textContent = data[name].e;
  document.getElementById('viewName').textContent = name;
  document.getElementById('affText').innerHTML = '<span class="aff-placeholder">Tap below to receive your affirmation</span>';
  document.getElementById('affText').classList.add('show');
  document.getElementById('shareBtn').classList.remove('show');
  document.getElementById('inspBtn').textContent = 'Inspire Me';
  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById('affView').classList.remove('active');
  document.getElementById('cats').classList.remove('hidden');
  cur = null;
}

function inspire() {
  if (!cur) return;
  const items = data[cur].a;
  let i;
  do { i = Math.floor(Math.random() * items.length); } while (i === last && items.length > 1);
  last = i;

  const el = document.getElementById('affText');
  el.classList.remove('show');

  setTimeout(() => {
    el.textContent = items[i];
    el.classList.add('show');
    document.getElementById('shareBtn').classList.add('show');
    document.getElementById('inspBtn').textContent = 'Inspire Me Again';
  }, 250);
}

function share() {
  const t = document.getElementById('affText').textContent;
  if (navigator.share) {
    navigator.share({ text: t });
  } else {
    navigator.clipboard.writeText(t).then(() => {
      const b = document.getElementById('shareBtn');
      b.textContent = 'Copied!';
      setTimeout(() => b.textContent = 'Share', 1500);
    });
  }
}

init();
</script>
